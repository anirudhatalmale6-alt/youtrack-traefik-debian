# =============================================================================
#  YouTrack + Traefik v3  —  Let's Encrypt via DNS-01 challenge (Namecheap)
# =============================================================================
#  Bring the stack up with:  docker compose up -d
#  Values that change per install live in the .env file next to this compose.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  Traefik — reverse proxy + ACME (DNS-01 / Namecheap) certificate resolver
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    # Namecheap credentials + tuning are injected as env vars for the ACME
    # (lego) DNS provider. They are defined in the .env file.
    environment:
      NAMECHEAP_API_USER: "${NAMECHEAP_API_USER}"
      NAMECHEAP_API_KEY:  "${NAMECHEAP_API_KEY}"
      # Optional tuning — safe defaults, override in .env if needed:
      NAMECHEAP_PROPAGATION_TIMEOUT: "${NAMECHEAP_PROPAGATION_TIMEOUT:-3600}"
      NAMECHEAP_POLLING_INTERVAL:    "${NAMECHEAP_POLLING_INTERVAL:-15}"
      NAMECHEAP_TTL:                 "${NAMECHEAP_TTL:-120}"
    ports:
      - "80:80"     # ACME DNS-01 does not need :80, but we keep it for an
                    # http->https redirect so plain-http visitors are bounced.
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme          # persists acme.json (the certs)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  # ---------------------------------------------------------------------------
  #  YouTrack — JetBrains official image, reached by Traefik on the web network
  # ---------------------------------------------------------------------------
  youtrack:
    image: jetbrains/youtrack:${YOUTRACK_VERSION}
    container_name: youtrack
    restart: unless-stopped
    # NOTE: we deliberately do NOT publish YouTrack's port to the host.
    # Traefik reaches it internally at  http://youtrack:8080  over the docker net.
    volumes:
      - youtrack-data:/opt/youtrack/data
      - youtrack-conf:/opt/youtrack/conf
      - youtrack-logs:/opt/youtrack/logs
      - youtrack-backups:/opt/youtrack/backups
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # ---- Router: HTTPS on the websecure entrypoint ----
      - "traefik.http.routers.youtrack.rule=Host(`${YOUTRACK_DOMAIN}`)"
      - "traefik.http.routers.youtrack.entrypoints=websecure"
      - "traefik.http.routers.youtrack.tls=true"
      - "traefik.http.routers.youtrack.tls.certresolver=namecheap"
      # Uncomment to additionally request a wildcard SAN on the same cert:
      # - "traefik.http.routers.youtrack.tls.domains[0].main=${YOUTRACK_DOMAIN}"
      # - "traefik.http.routers.youtrack.tls.domains[0].sans=*.${ROOT_DOMAIN}"

      # ---- Middlewares (defined in ./dynamic/middlewares.yml) ----
      - "traefik.http.routers.youtrack.middlewares=youtrack-headers@file"

      # ---- Service: YouTrack listens on 8080 inside the container ----
      - "traefik.http.services.youtrack.loadbalancer.server.port=8080"
      # Keep the connection to the backend on HTTP/1.1 (required for websockets/SSE)
      - "traefik.http.services.youtrack.loadbalancer.passhostheader=true"

networks:
  web:
    name: web

volumes:
  traefik-acme:
  youtrack-data:
  youtrack-conf:
  youtrack-logs:
  youtrack-backups:
