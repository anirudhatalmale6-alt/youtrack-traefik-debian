# =============================================================================
#  Traefik v3 static configuration  —  DNS-01 (Namecheap) certificate resolver
# =============================================================================

# ---- Entry points ----------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    http:
      # Everything on :80 is permanently redirected to HTTPS.
      # (ACME DNS-01 does not use :80 at all, so this redirect is always safe.)
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
    # Long-lived Server-Sent-Events (YouTrack live updates) must not be cut off.
    transport:
      respondingTimeouts:
        readTimeout: 0          # 0 = no limit; SSE streams stay open
        idleTimeout: 0

# ---- Providers -------------------------------------------------------------
# We define the router / service / middlewares in plain files (the `dynamic/`
# folder) rather than reading Docker container labels. This means Traefik never
# needs to talk to the Docker socket, which:
#   * avoids depending on the Docker Engine API version (newer Docker Engines
#     drop old API versions, which breaks Traefik's label auto-discovery), and
#   * is more secure — the Docker socket is never mounted into Traefik.
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ---- Certificate resolver: Let's Encrypt via DNS-01 (Namecheap) ------------
certificatesResolvers:
  namecheap:
    acme:
      email: "admin@example.com"          # <-- change to a real address
      storage: /etc/traefik/acme/acme.json
      # Start against STAGING to avoid rate limits while testing, then switch
      # to production by commenting the line below out.
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      # PRODUCTION endpoint (uncomment once staging issues a cert cleanly):
      # caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: namecheap
        # Query authoritative/public resolvers directly so Traefik sees the TXT
        # record as soon as it propagates, instead of trusting a cached local DNS.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        propagation:
          delayBeforeChecks: 0

# ---- Logging / dashboard (optional, handy while setting up) -----------------
log:
  level: INFO
api:
  dashboard: true
  insecure: false             # keep the dashboard off the public internet
