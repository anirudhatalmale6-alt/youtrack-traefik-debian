# =============================================================================
#  YouTrack + Traefik v3  —  Let's Encrypt via DNS-01 (Namecheap)
#  YouTrack served on :8443 ONLY — ports 80 and 443 stay free
# =============================================================================
#  Bring the stack up with:  docker compose up -d
#  Values that change per install live in the .env file next to this compose.
#
#  Users reach YouTrack at:  https://youtrack.example.com:8443
#  Nothing here binds :80 or :443, so another service can keep using them.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  Traefik — reverse proxy + ACME (DNS-01 / Namecheap) certificate resolver
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.9
    container_name: traefik
    restart: unless-stopped
    # Namecheap credentials + tuning are injected as env vars for the ACME
    # (lego) DNS provider. They are defined in the .env file.
    environment:
      NAMECHEAP_API_USER: "${NAMECHEAP_API_USER}"
      NAMECHEAP_API_KEY:  "${NAMECHEAP_API_KEY}"
      # Optional tuning — safe defaults, override in .env if needed:
      NAMECHEAP_PROPAGATION_TIMEOUT: "${NAMECHEAP_PROPAGATION_TIMEOUT:-3600}"
      NAMECHEAP_POLLING_INTERVAL:    "${NAMECHEAP_POLLING_INTERVAL:-15}"
      NAMECHEAP_TTL:                 "${NAMECHEAP_TTL:-120}"
    ports:
      # ONLY 8443 is published. Ports 80 and 443 are deliberately left free so
      # another service on this machine can use them. DNS-01 needs no inbound
      # port, so there is nothing to expose besides YouTrack's own HTTPS port.
      - "8443:8443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme          # persists acme.json (the certs)
      # NOTE: the Docker socket is intentionally NOT mounted. The router lives in
      # ./dynamic/youtrack.yml (file provider), so Traefik needs no Docker access.
    networks:
      - web

  # ---------------------------------------------------------------------------
  #  YouTrack — JetBrains official image, reached by Traefik on the web network
  # ---------------------------------------------------------------------------
  youtrack:
    image: jetbrains/youtrack:${YOUTRACK_VERSION}
    container_name: youtrack
    restart: unless-stopped
    # Give YouTrack up to 60s to shut down cleanly on `docker compose down/stop`
    # (the default is only 10s). This matches JetBrains' `docker stop -t 60`
    # recommendation so the embedded database flushes properly.
    stop_grace_period: 60s
    # NOTE: we deliberately do NOT publish YouTrack's port to the host.
    # Traefik reaches it internally at  http://youtrack:8080  over the docker net.
    #
    # Data is bind-mounted to host directories under /opt/youtrack so it is
    # visible on the machine and easy to back up. Create them ONCE before first
    # start and give them to YouTrack's uid (13001):
    #   mkdir -p /opt/youtrack/{data,conf,logs,backups}
    #   chown -R 13001:13001 /opt/youtrack/{data,conf,logs,backups}
    volumes:
      - /opt/youtrack/data:/opt/youtrack/data
      - /opt/youtrack/conf:/opt/youtrack/conf
      - /opt/youtrack/logs:/opt/youtrack/logs
      - /opt/youtrack/backups:/opt/youtrack/backups
    networks:
      - web
    # No Traefik labels are needed: the router and service that point at this
    # container (by its name, "youtrack", on the "web" network) are defined in
    # ./dynamic/youtrack.yml. YouTrack listens on 8080 inside the container and
    # is deliberately not published to the host — only Traefik reaches it.

networks:
  web:
    name: web

volumes:
  traefik-acme:          # acme.json (issued certificates) stays a Docker volume
  # YouTrack data uses host bind mounts (see the youtrack service above), so no
  # named volumes are declared for it.
