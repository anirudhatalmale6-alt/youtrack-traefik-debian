# =============================================================================
#  YouTrack + Traefik v3  —  Let's Encrypt via HTTP-01 challenge
# =============================================================================
#  Bring the stack up with:  docker compose up -d
#  Requires: port 80 reachable from the public internet (Let's Encrypt hits it).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  Traefik — reverse proxy + ACME (HTTP-01) certificate resolver
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.9
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"       # REQUIRED for HTTP-01: Let's Encrypt fetches the token here
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme          # persists acme.json (the certs)
      # Docker socket intentionally NOT mounted — router lives in ./dynamic/youtrack.yml
    networks:
      - web

  # ---------------------------------------------------------------------------
  #  YouTrack — JetBrains official image, reached by Traefik on the web network
  # ---------------------------------------------------------------------------
  youtrack:
    image: jetbrains/youtrack:${YOUTRACK_VERSION}
    container_name: youtrack
    restart: unless-stopped
    # Give YouTrack up to 60s to shut down cleanly on `docker compose down/stop`
    # (the default is only 10s). This matches JetBrains' `docker stop -t 60`
    # recommendation so the embedded database flushes properly.
    stop_grace_period: 60s
    # Port intentionally NOT published — Traefik reaches youtrack:8080 internally.
    #
    # Data is bind-mounted to host directories under /opt/youtrack. Create them
    # ONCE before first start and give them to YouTrack's uid (13001):
    #   mkdir -p /opt/youtrack/{data,conf,logs,backups}
    #   chown -R 13001:13001 /opt/youtrack/{data,conf,logs,backups}
    volumes:
      - /opt/youtrack/data:/opt/youtrack/data
      - /opt/youtrack/conf:/opt/youtrack/conf
      - /opt/youtrack/logs:/opt/youtrack/logs
      - /opt/youtrack/backups:/opt/youtrack/backups
    networks:
      - web
    # No Traefik labels needed: the router and service pointing at this container
    # (by name "youtrack" on the "web" network) live in ./dynamic/youtrack.yml.
    # YouTrack listens on 8080 inside the container and is not published to host.

networks:
  web:
    name: web

volumes:
  traefik-acme:          # acme.json (issued certificates) stays a Docker volume
  # YouTrack data uses host bind mounts (see the youtrack service above), so no
  # named volumes are declared for it.
